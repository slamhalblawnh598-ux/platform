<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة الاختبارات التفاعلية الموحدة</title>
<style>
:root {
  --bg: #faf7f2; --card: #fff; --tx: #2a1a1a; --ac: #9b1c0e; --ac2: #7d1013;
  --gold: #e8a317; --ok: #1f8a4c; --bad: #c0392b; --bd: #d9cfc4;
  --okb: #e3f5ea; --badb: #fbe5e2;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1514; --card: #271e1c; --tx: #f3e9e4; --ac: #e0624f; --ac2: #ff7b6b;
    --gold: #d4940f; --ok: #4fd08a; --bad: #ff7b6b; --bd: #4a3b37;
    --okb: #173324; --badb: #3d1e1a;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1514; --card: #271e1c; --tx: #f3e9e4; --ac: #e0624f; --ac2: #ff7b6b;
  --gold: #d4940f; --ok: #4fd08a; --bad: #ff7b6b; --bd: #4a3b37;
  --okb: #173324; --badb: #3d1e1a;
}
* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--bg); color: var(--tx); font-family: "Tajawal", "Segoe UI", Tahoma, "Noto Naskh Arabic", Arial, sans-serif; line-height: 1.7; }
.w { max-width: 720px; margin: 0 auto; padding: 16px; }

/* القائمة الرئيسية */
.menu-header { text-align: center; margin-bottom: 24px; }
.menu-header h1 { font-size: 24px; margin-bottom: 8px; color: var(--ac); }
.menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.menu-card { background: var(--card); border: 1px solid var(--bd); border-radius: 14px; padding: 20px; cursor: pointer; transition: all 0.2s ease; }
.menu-card:hover { transform: translateY(-4px); border-color: var(--ac); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
.menu-card h2 { font-size: 18px; margin: 0 0 8px; color: var(--ac); }
.menu-card p { margin: 0; color: var(--tx); opacity: 0.85; font-size: 15px; }
.menu-card .start-btn { margin-top: 16px; font-size: 14px; color: var(--ac); font-weight: 700; display: flex; align-items: center; gap: 6px; }

/* واجهة الاختبار */
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: 700; color: var(--ac); font-size: 15px; }
.progress-bar { height: 8px; background: var(--bd); border-radius: 6px; overflow: hidden; margin-bottom: 16px; }
.progress-bar i { display: block; height: 100%; background: var(--ac); transition: width 0.3s; }
.card { background: var(--card); border: 1px solid var(--bd); border-radius: 16px; padding: 18px; box-shadow: 0 3px 12px rgba(0,0,0,0.04); }
.q-text { font-size: 1.15rem; font-weight: 700; color: var(--ac); margin: 0 0 12px; line-height: 1.6; }
.q-text .v, .q-text .cap { display: block; color: var(--tx); font-weight: 600; margin-top: 6px; font-size: 1rem; }
.fig { text-align: center; margin: 12px 0; overflow-x: auto; }
.fig svg { max-width: 100%; height: auto; max-height: 300px; }
.fig text { fill: currentColor; font-family: inherit; }
.fig .r, .fig .f { fill: var(--ac); }
.fig line, .fig path, .fig rect, .fig polygon, .fig circle, .fig polyline { stroke: currentColor; fill: none; stroke-width: 1.6; }
.fig .dot { fill: currentColor; }
.fig .b { font-weight: 700; font-size: 15px; }

/* الخيارات */
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
@media (max-width: 520px) { .opts { grid-template-columns: 1fr; } }
.opt { font: inherit; text-align: start; display: flex; align-items: center; gap: 10px; padding: 12px; border: 2px solid var(--bd); background: var(--card); color: var(--tx); border-radius: 12px; cursor: pointer; font-size: 1.05rem; transition: all 0.2s; }
.opt:hover:not(:disabled) { border-color: var(--ac); background: rgba(155, 28, 14, 0.03); }
.opt-letter { flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--ac); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 0.95rem; }
.opt.ok { border-color: var(--ok); background: var(--okb); }
.opt.ok .opt-letter { background: var(--ok); }
.opt.bad { border-color: var(--bad); background: var(--badb); }
.opt.bad .opt-letter { background: var(--bad); }
.opt:disabled { cursor: default; opacity: 0.9; }

/* الحل والتنقل */
.explanation { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: rgba(232, 163, 23, 0.1); border: 1px dashed var(--gold); display: none; font-size: 0.95rem; line-height: 1.6; }
.explanation.show { display: block; }
.nav-buttons { display: flex; justify-content: space-between; margin-top: 20px; gap: 10px; }
.btn { font: inherit; border: 0; border-radius: 12px; padding: 12px 24px; background: var(--ac); color: #fff; cursor: pointer; font-weight: 700; font-size: 1rem; transition: opacity 0.2s; }
.btn:hover { opacity: 0.9; }
.btn.secondary { background: var(--bd); color: var(--tx); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* تنسيقات رياضية خاصة */
.frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; vertical-align: middle; margin: 0 4px; }
.frac span:first-child { border-bottom: 2px solid currentColor; padding: 0 6px; }
.fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 4px; line-height: 1.3; }
.fr i { font-style: normal; border-bottom: 1.5px solid currentColor; padding: 0 4px; }
.fr b { font-weight: normal; }
.m { direction: ltr; display: inline-block; unicode-bidi: isolate; }
.rt { white-space: nowrap; }
.rt s { text-decoration: none; border-top: 1.5px solid currentColor; padding: 0 2px; }

/* شاشة النتائج */
.res-box { text-align: center; padding: 20px 0; display: none; }
.score-big { font-size: 3rem; font-weight: 800; color: var(--ac); margin-bottom: 8px; }
.res-msg { font-size: 1.1rem; margin-bottom: 20px; opacity: 0.9; }
.review-list { display: grid; gap: 8px; margin: 20px 0; text-align: right; }
.review-item { padding: 10px 14px; border-radius: 10px; background: rgba(0,0,0,0.03); display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem; }
.review-item.ok { background: var(--okb); border: 1px solid var(--ok); }
.review-item.bad { background: var(--badb); border: 1px solid var(--bad); }
.hide { display: none !important; }
</style>
</head>
<body>

<!-- القائمة الرئيسية -->
<div id="main-menu" class="w">
  <div class="menu-header">
    <h1>منصة الاختبارات التفاعلية الموحدة</h1>
    <p style="opacity:0.7">اختر الاختبار الذي ترغب في بدءه</p>
  </div>
  <div id="menu-cards" class="menu-grid"></div>
</div>

<!-- حاوية الاختبار -->
<div id="quiz-container" class="w hide">
  <h2 id="quiz-title" style="color:var(--ac); margin:0 0 16px; font-size:1.3rem;"></h2>
  <div class="top-bar">
    <span id="counter"></span>
    <span id="live-score"></span>
  </div>
  <div class="progress-bar"><i id="prog"></i></div>
  
  <div class="card" id="q-card"></div>
  
  <div class="nav-buttons">
    <button class="btn secondary" id="btn-prev" onclick="navigate(-1)">السابق</button>
    <button class="btn" id="btn-next" onclick="navigate(1)">التالي</button>
  </div>
</div>

<!-- شاشة النتائج -->
<div id="result-container" class="w hide">
  <div class="card res-box" id="res-box">
    <div class="score-big" id="final-score"></div>
    <div class="res-msg" id="final-msg"></div>
    <div class="review-list" id="review-list"></div>
    <div class="nav-buttons" style="justify-content:center">
      <button class="btn" onclick="restartQuiz()">إعادة الاختبار</button>
      <button class="btn secondary" onclick="showMenu()">القائمة الرئيسية</button>
    </div>
  </div>
</div>

<script>
// ==========================================
// أدوات مساعدة موحدة (Global Helpers)
// ==========================================
const OPT_LETTERS = ['أ', 'ب', 'ج', 'د'];
const AR_DIGITS = '٠١٢٣٤٥٦٧٨٩';

function arabize(root) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n;
  while (n = w.nextNode()) {
    n.nodeValue = n.nodeValue.replace(/(\d)\.(\d)/g, '$1٫$2').replace(/\d/g, d => AR_DIGITS[d]);
  }
}

// ==========================================
// قاعدة بيانات الاختبارات (معزولة لتجنب التعارض)
// ==========================================
const QUIZZES = {
  // ---------------------------------------------------------
  // 1. الاختبار الكمي (Quantitative)
  // ---------------------------------------------------------
  quant: (function() {
    const sv = (vb, x) => `<svg class="g" viewBox="${vb}" xmlns="http://www.w3.org/2000/svg">${x}</svg>`;
    const ch = (g, col, max, tk, showv, leg) => {
      const x0 = 45, x1 = 430, y0 = 15, y1 = 195, n = g.length, gw = (x1 - x0) / n, k = g[0].v.length, bw = gw * .7 / k;
      let s = '';
      tk.forEach(t => { const y = y1 - t / max * (y1 - y0); s += `<line x1="${x0}" x2="${x1}" y1="${y}" y2="${y}" opacity=".3" /><text x="${x0 - 5}" y="${y + 4}" text-anchor="end" font-size="11">${t}</text>`; });
      g.forEach((d, i) => { d.v.forEach((v, j) => { const h = v / max * (y1 - y0), x = x0 + i * gw + gw * .15 + j * bw; s += `<rect x="${x}" y="${y1 - h}" width="${bw}" height="${h}" style="fill:${col[j]};stroke:none" />` + (showv ? `<text x="${x + bw / 2}" y="${y1 - h - 4}" text-anchor="middle" font-size="11">${v}</text>` : ''); }); s += `<text x="${x0 + i * gw + gw / 2}" y="${y1 + 16}" text-anchor="middle" font-size="12">${d.l}</text>`; });
      s += `<line x1="${x0}" x2="${x0}" y1="${y0}" y2="${y1}" /><line x1="${x0}" x2="${x1}" y1="${y1}" y2="${y1}" />`;
      return sv('0 0 440 220', s) + (leg ? '<div class="leg">' + leg.map(a => `<span><b style="background:${a[0]}"></b>${a[1]}</span>`).join('') + '</div>' : '');
    };
    const ln = () => {
      const xs = i => 60 + i * 58, ys = v => 195 - v * 180, v = [.4, .6, .5, .6, .7, .6, .9]; let s = '';
      for (let i = 0; i <= 10; i++) { s += `<line x1="45" x2="420" y1="${ys(i / 10)}" y2="${ys(i / 10)}" opacity=".35" /><text x="40" y="${ys(i / 10) + 4}" text-anchor="end" font-size="10">${i / 10}</text>`; }
      v.forEach((_, i) => { s += `<line x1="${xs(i)}" x2="${xs(i)}" y1="15" y2="195" opacity=".35" /><text x="${xs(i)}" y="212" text-anchor="middle" font-size="11">${1428 + i}</text>`; });
      s += `<polyline points="${v.map((a, i) => xs(i) + ',' + ys(a)).join(' ')}" style="stroke-width:2.5" />`;
      return sv('0 0 440 225', s) + '<div class="leg">الميزانية بملايين الريالات (المحور الرأسي) – السنوات (المحور الأفقي)</div>';
    };
    const pie = (sl) => {
      let a = 0, s = ''; const P = t => [150 + 110 * Math.sin(t * Math.PI / 180), 130 - 110 * Math.cos(t * Math.PI / 180)];
      sl.forEach(d => { const a2 = a + d.p * 3.6, [x1, y1] = P(a), [x2, y2] = P(a2), m = (a + a2) / 2 * Math.PI / 180, r = d.r || 75, tx = 150 + r * Math.sin(m), ty = 130 - r * Math.cos(m);
        s += `<path d="M150 130L${x1} ${y1}A110 110 0 ${a2 - a > 180 ? 1 : 0} 1 ${x2} ${y2}Z" />`;
        if (d.t) s += `<text x="${tx}" y="${ty - 2}" text-anchor="middle" font-size="${d.fs || 11}" style="fill:var(--ac);font-weight:700">${d.t}</text>` + (d.c ? `<text x="${tx}" y="${ty + 11}" text-anchor="middle" font-size="${d.fs || 11}" style="fill:var(--ac)">${d.c}</text>` : ''); a = a2; });
      return sv('30 10 240 240', s);
    };
    const rt = n => `<span class="rt">√<s>${n}</s></span>`;
    const R = '#a01808';

    const rawQ = [
      {q:'مساحة المربع (أ) = (5) سم<sup>2</sup><br>مساحة المربع (ب) = (4) سم<sup>2</sup><br>أوجد مساحة المربع ( ج )',o:['1','2','3','4'],a:0, f:sv('0 -30 280 280','<polygon points="80,120 200,120 200,240 80,240"/><polygon points="80,120 123.2,62.4 65.6,19.2 22.4,76.8"/><polygon points="123.2,62.4 200,120 257.6,43.2 180.8,-14.4"/><polyline points="80,120 123.2,62.4 200,120"/><text class="b" x="136" y="185">أ</text><text class="b" x="45" y="55">ج</text><text class="b" x="198" y="48">ب</text>')},
      {q:'ما نسبة زيادة ميزانية المعهد من عام 1428 إلى عام 1429 ؟',o:['75%','50%','33%','20%'],a:1,f:ln()},
      {q:'أي المدن في زيادة مطردة دائماً ؟',o:['مكة','المدينة','الشرقية','عسير'],a:2, f:ch([{l:1434,v:[17,14,25,18]},{l:1433,v:[15,13,23,15]},{l:1432,v:[14,14,21,11]},{l:1431,v:[13,16,16,13]},{l:1430,v:[12,15,17,12]}],['#111','#aaa',R,'#c9962a'],30,[0,5,10,15,20,25,30],0,[['#111','الشرقية'],['#aaa','عسير'],[R,'المدينة'],['#c9962a','مكة']])},
      {q:'الشكل التالي: دائرة مركزها م ، احسب مساحة الدائرة',o:['8ط','12ط','16ط','20ط'],a:2, f:sv('0 0 300 200','<circle cx="150" cy="100" r="80"/><line x1="150" y1="20" x2="150" y2="180"/><polyline points="150,20 80.7,140 150,180"/><circle class="dot" cx="150" cy="100" r="4"/><text x="158" y="98">م</text><text x="132" y="48" font-size="11">30°</text><text x="85" y="172">4 سم</text>')},
      {q:'في الشكل التالي: قارن بين<br>القيمة الأولى: 100<br>القيمة الثانية: س',o:['القيمة الأولى أكبر','القيمة الثانية أكبر','القيمتان متساويتان','المعطيات غير كافية'],a:3, f:sv('0 0 300 190','<polyline points="60,150 110,20 240,150 60,150"/><polyline points="60,150 190,20 240,150"/><text x="8" y="95">1 سم</text><text x="78" y="128" font-size="11">25°</text><text x="143" y="85" font-size="11">س°</text><polyline points="140,165 140,170 195,170 195,160" /><text x="150" y="186">2 سم</text>')},
      {q:'ما عدد الطلاب الذين لا يتجاوز طولهم 120سم',o:['10','15','20','25'],a:3,f:ch([{l:90,v:[10]},{l:120,v:[15]},{l:150,v:[5]}],[R],16,[4,8,12,16],1,[['transparent','المحور الأفقي: الطول (بالسم) – المحور الرأسي: عدد الطلاب']])},
      {q:'ما مدى أطوال الطلاب؟',o:['10','30','50','60'],a:3,f:ch([{l:90,v:[10]},{l:120,v:[15]},{l:150,v:[5]}],[R],16,[4,8,12,16],1,[['transparent','المحور الأفقي: الطول (بالسم) – المحور الرأسي: عدد الطلاب']])},
      {q:'إذا كان عرض المستطيل = <span class="fr"><i>1</i><i>4</i></span> طوله ،<br>أوجد عرض المستطيل',o:['8','4','2','1'],a:3, f:sv('0 0 360 140','<rect x="10" y="25" width="340" height="85"/><line x1="10" y1="110" x2="350" y2="25"/><g transform="rotate(-14 180 70)"><text x="165" y="86" font-size="14">√17</text><line x1="179" x2="203" y1="72" y2="72"/></g>')},
      {q:'أوجد مساحة المربع',o:['16','32','48','64'],a:3, f:sv('0 0 220 220','<rect x="10" y="10" width="200" height="200"/><circle cx="110" cy="110" r="100"/><circle class="dot" cx="110" cy="110" r="5"/><line x1="110" y1="110" x2="110" y2="210" style="stroke-width:5"/><text x="60" y="170">4 سم</text>')},
      {q:'أوجد نسبة الزيادة بين عامي 1433 إلى عام 1430؟',o:['20%','25%','10%','15%'],a:0,f:ch([{l:1433,v:[150]},{l:1432,v:[140]},{l:1431,v:[110]},{l:1430,v:[125]}],[R],160,[0,20,40,60,80,100,120,140,160],1)},
      {q:'أوجد قيمة س',o:['40','50','60','70'],a:3, f:sv('0 0 360 330','<line x1="95" y1="70" x2="305" y2="245"/><line x1="165" y1="30" x2="95" y2="315"/><line x1="50" y1="265" x2="310" y2="180"/><line x1="189" y1="142" x2="201" y2="156"/><line x1="120" y1="172" x2="136" y2="178"/><text x="75" y="75" font-size="12">40°</text><text x="262" y="205" font-size="12">س°</text>')},
      {q:'إذا كان الشكل المربع أوجد : أ ب + ج د',o:['15','16','19','20'],a:2, f:sv('0 0 420 320','<rect x="95" y="115" width="163" height="165"/><line x1="95" y1="115" x2="370" y2="280"/><line x1="258" y1="280" x2="370" y2="280"/><text x="165" y="105">12</text><text x="68" y="200">12</text><text x="150" y="302">12</text><text x="268" y="165">9</text><text x="268" y="252">3</text><text x="228" y="208" class="b">ب</text><text x="308" y="238">5</text><text class="b" x="380" y="298">ج</text><text class="b" x="250" y="302">د</text><text class="b" x="78" y="112">أ</text>')},
      {q:'الشكل التالي مستطيل أوجد نسبة مساحة المظلل إلى الشكل',o:['2:1','3:1','4:1','8:1'],a:2, f:sv('0 0 480 170','<rect x="30" y="20" width="420" height="130"/><polygon class="f" points="30,85 240,85 135,150"/><polygon class="f" points="240,85 345,20 450,85"/><line x1="22" y1="52" x2="38" y2="52"/><line x1="442" y1="52" x2="458" y2="52"/><line x1="22" y1="118" x2="38" y2="118"/><line x1="442" y1="118" x2="458" y2="118"/>')},
      {q:'ما المادة التي تفوق فيها البنون عن البنات؟',o:['لغة إنجليزية','إدارة أعمال','رياضيات','تاريخ'],a:1, f:ch([{l:'لغة إنجليزية',v:[10,15]},{l:'رياضيات',v:[15,15]},{l:'إدارة أعمال',v:[25,17]},{l:'تاريخ',v:[17,20]}],['#f39c12',R],30,[0,5,10,15,20,25,30],0,[['#f39c12','بنين'],[R,'بنات']])},
      {q:'أوجد طول قطر النصف دائرة؟',o:['14','15','20','22'],a:0, f:sv('0 0 450 285','<polygon points="60,253 385,253 177,97"/><path class="f" d="M125 253A113.75 113.75 0 0 1 352.5 253Z"/><circle class="dot" cx="238.75" cy="253" r="3"/><polygon class="f" points="177,97 168.6,108.2 179.8,116.6 188.2,105.4"/><text x="100" y="170">12</text><text x="300" y="165">16</text><text x="85" y="274">4</text><text x="365" y="274">2</text><text class="b" x="385" y="245">أ</text><text class="b" x="35" y="248">ج</text><text class="b" x="170" y="86">ب</text>')},
      {q:'أوجد قياس زاوية أ ج م :',o:['30','60','90','120'],a:0, f:sv('0 0 300 260','<circle cx="150" cy="130" r="110"/><polygon points="150,20 54.7,185 245.3,185"/><polyline points="54.7,185 150,130 245.3,185"/><line x1="150" y1="130" x2="150" y2="185"/><polygon points="150,185 162,185 162,173 150,173"/><circle class="dot" cx="150" cy="130" r="3"/><text class="b" x="158" y="16">م</text><text class="b" x="132" y="124">أ</text><text class="b" x="252" y="192">ج</text><text x="128" y="156" font-size="11">60</text><text x="80" y="252" font-size="11">الرسم ليس على القياس</text>')},
      {q:'أوجد نسبة المحاصيل الأخرى',o:['51%','50%','49%','40%'],a:2, f:pie([{p:49,t:'محاصيل أخرى',fs:12,r:55},{p:6,t:'قمح',c:'6%',fs:8,r:88},{p:9,t:'ذرة',c:'9%',fs:9,r:80},{p:12,t:'شعير',c:'12%',fs:9,r:78},{p:11,t:'أرز',c:'11%',fs:9,r:78},{p:8,t:'قطن',c:'8%',fs:9,r:80},{p:5,t:'خضروات',c:'5%',fs:7,r:90}])},
      {q:'كم تمثل نسبة الأسماك والخضار والفواكه إلى المجموع ؟',o:['خمس','ربع','نصف','سدس'],a:2, f:pie([{p:10,t:'أسماك',c:'10%',r:80},{p:25},{p:25},{p:22,t:'خضار',c:'22%',r:75},{p:18,t:'فواكه',c:'18%',r:78}].map((d,i)=>d))},

  math: (function() {

      const tot=sl.reduce((a,s)=>a+s.v,0);let a0=-Math.PI/2,out='';

        const am=(a0+a1)/2,r=R*(s.r||.62),lx=cx+r*Math.cos(am),ly=cy+r*Math.sin(am);

    const bars = (o) => {

        if(o.axis!==false)s+=`<text x="${ml-5}" y="${y+4}" text-anchor="end" font-size="10">${v}</text>`;
      }
      const n=o.labels.length,gw=pw/n,k=o.series.length,bw=gw*.72/k;

      {t:'قارن بين: القيمة الأولى: س ، القيمة الثانية: ص',fig:()=>'<svg viewBox="0 0 220 130"><line x1="10" y1="35" x2="210" y2="35" stroke="currentColor"/><line x1="10" y1="95" x2="210" y2="95" stroke="currentColor"/><line x1="95" y1="5" x2="125" y2="125" stroke="currentColor"/><text x="110" y="30" font-size="11" fill="#c0392b">3 س</text><text x="108" y="90" font-size="11" fill="#c0392b">6 ص</text></svg>',o:['القيمة الأولى أكبر','القيمة الثانية أكبر','القيمتان متساويتان','المعطيات غير كافية'],a:3,e:'المعطيات غير كافية للمقارنة (حسب مفتاح الإجابة)'},
      {t:'إذا كان ب ج = 5 سم، أ ج = 4 سم، أوجد طول د هـ.',fig:()=>'<svg viewBox="0 0 200 130"><polygon points="20,110 170,110 138,48" fill="none" stroke="currentColor"/><line x1="79" y1="79" x2="95" y2="110" stroke="currentColor"/><g font-size="12" fill="#c0392b"><text x="4" y="118">ج</text><text x="173" y="118">ب</text><text x="136" y="42">أ</text><text x="68" y="76">د</text><text x="92" y="124">هـ</text></g></svg>',o:['1.5','2','2.5','3'],a:0,e:'أ ب = 3 (فيثاغورس) ، د منتصف أ ج و د هـ ∥ أ ب ← د هـ = ½ × 3 = 1.5'},
      {t:'ما عدد الساعات اللازمة ليصبح عدد السيارات يوم الاثنين يساوي عدد السيارات في يوم الخميس في 4 ساعات؟ (معدل انسياب السيارات في الساعة)',fig:()=>bar([200,450,400,350,500,300,100],['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'],{max:500,show:1,c:'#fbb040'}),o:['1.5','2.5','2.7','3'],a:3,e:'الخميس: 300 × 4 = 1200 سيارة ← الاثنين: 1200 ÷ 400 = 3 ساعات'},
      {t:'مجموع الحوادث في عام 1430هـ بلغت 18000، أوجد الحوادث بسبب السرعة؟',fig:()=>pie([['السرعة',35,C[0],'126°'],['استخدام الجوال',12.5,C[1],'45°'],['قطع الإشارة',8.33,C[2],'30°'],['أخرى',44.17,C[3],'159°']]),o:['6300','6000','6500','6800'],a:0,e:'126 ÷ 360 × 18000 = 6300'},
      {t:'ما متوسط عدد اللوحات عام 1427؟',fig:()=>bar([60,65,80,45],['محمد','أحمد','سعد','فهد'],{max:100,step:20,c:'#c0392b'}),o:['60','61','62.5','65'],a:2,e:'الرسم تقريبي — الجواب حسب مفتاح الإجابة: 62.5'},
      {t:'أوجد عدد سكان اليمن',fig:()=>'<table class="t" style="border-collapse:collapse;font-size:13px;margin:auto"><tr><th style="border:1px solid var(--bd);padding:3px 8px">الدولة</th><th style="border:1px solid var(--bd);padding:3px 8px">المساحة</th><th style="border:1px solid var(--bd);padding:3px 8px">عدد السكان</th><th style="border:1px solid var(--bd);padding:3px 8px">الكثافة</th></tr><tr><td style="border:1px solid var(--bd);padding:3px 8px">اليمن</td><td style="border:1px solid var(--bd);padding:3px 8px">560000</td><td style="border:1px solid var(--bd);padding:3px 8px">؟</td><td style="border:1px solid var(--bd);padding:3px 8px">14</td></tr></table>',o:['7840000','784000','40000','4000'],a:0,e:'عدد السكان = المساحة × الكثافة = 560000 × 14 = 7840000'},
      {t:'الشكل التالي يمثل مصروفات سلطان شهريًّا. إذا كان إجمالي مصروفاته 5000 ريال شهريًّا، ونسبة ما صرفه في السفر 65% مما صرف في الترفيه، أوجد المبلغ الذي صرفه في السفر.',fig:()=>pie([['فواتير',6,C[0]],['ترفيه',20,C[1],'س%'],['طعام',22,C[2]],['إيجار',10,C[3]],['ملابس',30,C[4]],['أقساط',12,C[5]]]),o:['1650','650','325','250'],a:1,e:'الترفيه = 100 − (6+22+10+30+12) = 20% = 1000 ريال ← 65% × 1000 = 650'},
      {t:'إذا كان إجمالي مصروفاته 5000 ريال شهريًّا، ما المبلغ الذي دفعه في الطعام؟',fig:()=>pie([['فواتير',6,C[0]],['ترفيه',20,C[1],'س%'],['طعام',22,C[2]],['إيجار',10,C[3]],['ملابس',30,C[4]],['أقساط',12,C[5]]]),o:['800','900','1000','1100'],a:3,e:'22% × 5000 = 1100 ريال'}
    ];

    return {
      title: 'اختبار تفاعلي عام',
      desc: 'اختبار متنوع من 23 سؤالًا (إحصاء، هندسة، حساب، ومنطقيات).',
      questions: rawQ.map(q => ({
        text: q.t,
        options: q.o,
        answer: q.a,
        figure: typeof q.fig === 'function' ? q.fig() : (q.fig || ''),
        explanation: q.e || ''
      }))
    };
  })()
};

// ==========================================
// محرك الاختبار الموحد (Unified Engine)
// ==========================================
let currentQuiz = null;
let qIndex = 0;
let score = 0;
let answers = [];
let shuffledOrder = [];

function initMenu() {
  const menu = document.getElementById('menu-cards');
  menu.innerHTML = Object.keys(QUIZZES).map(key => {
    const qz = QUIZZES[key];
    return `
      <div class="menu-card" onclick="startQuiz('${key}')">
        <h2>${qz.title}</h2>
        <p>${qz.desc}</p>
        <div class="start-btn">ابدأ الاختبار ←</div>
      </div>
    `;
  }).join('');
}

function showMenu() {
  document.getElementById('main-menu').classList.remove('hide');
  document.getElementById('quiz-container').classList.add('hide');
  document.getElementById('result-container').classList.add('hide');
}

function startQuiz(quizKey) {
  currentQuiz = QUIZZES[quizKey];
  qIndex = 0;
  score = 0;
  shuffledOrder = [...Array(currentQuiz.questions.length).keys()];
  
  // خلط الأسئلة اختياري (يمكن تفعيله بإزالة التعليق عن السطر التالي)
  // shuffledOrder.sort(() => Math.random() - 0.5);
  
  answers = new Array(currentQuiz.questions.length).fill(null);
  
  document.getElementById('main-menu').classList.add('hide');
  document.getElementById('result-container').classList.add('hide');
  document.getElementById('quiz-container').classList.remove('hide');
  document.getElementById('quiz-title').textContent = currentQuiz.title;
  
  renderQuestion();
}

function renderQuestion() {
  const q = currentQuiz.questions[qIndex];
  const realIndex = shuffledOrder[qIndex];
  
  document.getElementById('counter').textContent = `السؤال ${qIndex + 1} من ${currentQuiz.questions.length}`;
  document.getElementById('prog').style.width = ((qIndex / currentQuiz.questions.length) * 100) + '%';
  
  const answeredCount = answers.filter(a => a !== null).length;
  const correctCount = answers.filter((a, i) => a === currentQuiz.questions[shuffledOrder[i]].answer).length;
  document.getElementById('live-score').textContent = `الصحيحة: ${correctCount} / ${answeredCount}`;
  
  const card = document.getElementById('q-card');
  card.innerHTML = `
    <div class="q-text">${q.text}</div>
    ${q.figure ? `<div class="fig">${q.figure}</div>` : ''}
    <div class="opts" id="opts-container">
      ${q.options.map((opt, i) => `
        <button class="opt" data-i="${i}" ${answers[qIndex] !== null ? 'disabled' : ''}>
          <span class="opt-letter">${OPT_LETTERS[i]}</span>
          <span>${opt}</span>
        </button>
      `).join('')}
    </div>
    <div class="explanation ${answers[qIndex] !== null ? 'show' : ''}" id="ex-box">
      <b>الحل:</b> ${q.explanation}
    </div>
  `;
  
  // تطبيق تحويل الأرقام للعربية
  arabize(card);
  
  // إذا كان السؤال مجاباً مسبقاً، قم بتمييز الإجابات
  if (answers[qIndex] !== null) {
    markAnswer(qIndex);
  } else {
    // إضافة مستمعي الأحداث للأزرار
    document.querySelectorAll('.opt').forEach(btn => {
      btn.onclick = () => pickOption(parseInt(btn.dataset.i));
    });
  }
  
  // تحديث أزرار التنقل
  document.getElementById('btn-prev').disabled = (qIndex === 0);
  document.getElementById('btn-next').textContent = (qIndex === currentQuiz.questions.length - 1) ? 'إنهاء وعرض النتيجة' : 'التالي';
}

function pickOption(selectedIndex) {
  if (answers[qIndex] !== null) return; // منع الإجابة المتعددة
  
  const realIndex = shuffledOrder[qIndex];
  const q = currentQuiz.questions[realIndex];
  
  answers[qIndex] = selectedIndex;
  if (selectedIndex === q.answer) {
    score++;
  }
  
  markAnswer(qIndex);
  
  // تحديث النتيجة المباشرة
  const answeredCount = answers.filter(a => a !== null).length;
  const correctCount = answers.filter((a, i) => a === currentQuiz.questions[shuffledOrder[i]].answer).length;
  document.getElementById('live-score').textContent = `الصحيحة: ${correctCount} / ${answeredCount}`;
  arabize(document.getElementById('live-score'));
}

function markAnswer(qIdx) {
  const realIndex = shuffledOrder[qIdx];
  const q = currentQuiz.questions[realIndex];
  const selected = answers[qIdx];
  
  const buttons = document.querySelectorAll('.opt');
  buttons.forEach(btn => {
    const i = parseInt(btn.dataset.i);
    btn.disabled = true;
    if (i === q.answer) {
      btn.classList.add('ok');
    } else if (i === selected && i !== q.answer) {
      btn.classList.add('bad');
    }
  });
  
  document.getElementById('ex-box').classList.add('show');
}

function navigate(direction) {
  if (direction === 1 && qIndex === currentQuiz.questions.length - 1) {
    showResults();
    return;
  }
  
  qIndex += direction;
  if (qIndex < 0) qIndex = 0;
  if (qIndex >= currentQuiz.questions.length) qIndex = currentQuiz.questions.length - 1;
  
  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showResults() {
  document.getElementById('quiz-container').classList.add('hide');
  document.getElementById('result-container').classList.remove('hide');
  
  const total = currentQuiz.questions.length;
  const percentage = Math.round((score / total) * 100);
  
  document.getElementById('final-score').textContent = `${score} / ${total}`;
  
  let msg = '';
  if (percentage >= 90) msg = 'ممتاز! أداء رائع 🌟';
  else if (percentage >= 70) msg = 'جيد جدًا، استمر في التقدم!';
  else if (percentage >= 50) msg = 'جيد، راجع الأخطاء وحاول مجددًا.';
  else msg = 'تحتاج إلى مزيد من المراجعة، لا تستسلم 💪';
  
  document.getElementById('final-msg').textContent = `${percentage}% - ${msg}`;
  
  // قائمة المراجعة
  const reviewList = document.getElementById('review-list');
  reviewList.innerHTML = currentQuiz.questions.map((q, i) => {
    const userAns = answers[i];
    const isCorrect = userAns === q.answer;
    const statusClass = isCorrect ? 'ok' : 'bad';
    const statusText = userAns === null ? 'بدون إجابة' : (isCorrect ? '✓ صحيحة' : `✗ خاطئة (الصحيح: ${OPT_LETTERS[q.answer]})`);
    
    return `
      <div class="review-item ${statusClass}">
        <span>سؤال ${i + 1}</span>
        <span>${statusText}</span>
      </div>
    `;
  }).join('');
  
  arabize(document.getElementById('result-container'));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restartQuiz() {
  // إعادة تشغيل نفس الاختبار
  startQuiz(Object.keys(QUIZZES).find(key => QUIZZES[key] === currentQuiz));
}

// تهيئة التطبيق عند التحميل
initMenu();
</script>
